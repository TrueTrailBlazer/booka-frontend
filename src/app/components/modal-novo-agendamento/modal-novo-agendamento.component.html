@if (showModal) {
<div class="modal modal-open">
  <div class="modal-box bg-white overflow-visible relative">
    <form method="dialog">
      <button (click)="fechar()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 text-slate-500">✕</button>
    </form>
    <h3 class="font-black text-lg text-slate-800 mb-6 flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">add_circle</span>
      Novo Agendamento
    </h3>

    @if (isCarregando) {
      <div class="flex justify-center items-center py-12">
        <span class="loading loading-spinner text-primary loading-md"></span>
      </div>
    } @else {
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-1">Cliente *</label>
          <select [(ngModel)]="form.clienteId" class="select select-bordered w-full bg-slate-50 text-slate-700 font-medium">
            <option value="" disabled selected>Selecione um cliente</option>
            @for (c of clientes; track c.id) {
              <option [value]="c.id">{{ c.nome }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-1">Serviço *</label>
          <select [(ngModel)]="form.servicoId" class="select select-bordered w-full bg-slate-50 text-slate-700 font-medium">
            <option value="" disabled selected>Selecione o serviço</option>
            @for (s of servicos; track s.id) {
              <option [value]="s.id">{{ s.nome }} ({{ s.duracaoMinutos }} min)</option>
            }
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-1">Data *</label>
            <input type="date" [(ngModel)]="form.data" class="input input-bordered w-full bg-slate-50 text-slate-700 font-medium"/>
          </div>
          <div>
            <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-1">Hora *</label>
            <input type="time" [(ngModel)]="form.hora" class="input input-bordered w-full bg-slate-50 text-slate-700 font-medium"/>
          </div>
        </div>

        <div>
          <label class="block text-xs font-black uppercase tracking-widest text-slate-500 mb-1">Observações</label>
          <textarea [(ngModel)]="form.observacoes" class="textarea textarea-bordered w-full bg-slate-50 text-slate-700 font-medium" rows="2" placeholder="Opcional"></textarea>
        </div>
      </div>

      <div class="modal-action mt-8 flex gap-3">
        <button (click)="fechar()" class="btn btn-ghost font-bold text-slate-500 flex-1 sm:flex-none">Cancelar</button>
        <button (click)="salvar()" [disabled]="isSalvando" class="btn btn-primary text-white font-bold px-6 shadow-md shadow-primary/20 flex-1 sm:flex-none">
          @if (isSalvando) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            <span class="material-symbols-outlined text-[18px]">save</span> Confirmar
          }
        </button>
      </div>
    }
  </div>
  <form method="dialog" class="modal-backdrop bg-slate-900/40">
    <button (click)="fechar()">close</button>
  </form>
</div>
}
